name: atlas-regenerate-restore

on:
  push:
    branches:
      - docs/restore-invariants-i-vii

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/restore-invariants-i-vii

      - name: Regenerate Atlas
        shell: pwsh
        run: ./scripts/atlas-generate.ps1

      - name: Preserve Atlas PWA hooks
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/atlas/index.html')
          text = path.read_text(encoding='utf-8')
          needle = '  <title>GroundMesh Atlas</title>\n'
          insert = needle + (
              '  <meta name="theme-color" content="#1f5c46" />\n'
              '  <link rel="icon" href="../assets/gm-app-icon.svg" type="image/svg+xml" />\n'
              '  <link rel="manifest" href="../manifest.webmanifest" />\n'
              '  <script src="../assets/pwa-init.js" defer></script>\n'
          )
          if needle not in text:
              raise SystemExit('Atlas title marker not found')
          path.write_text(text.replace(needle, insert, 1), encoding='utf-8', newline='\n')

      - name: Commit generated Atlas
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- docs/atlas/index.html; then
            echo "Atlas already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/atlas/index.html
          git commit -m "docs(atlas): normalize generated invariant registry"
          git push origin HEAD:docs/restore-invariants-i-vii
