name: constitutional-pass-helper

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'docs/constitutional-stewardship-v0-1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/constitutional-stewardship-v0-1

      - name: Normalize proposed registry status and Atlas row
        shell: python
        run: |
          import json, re
          from pathlib import Path

          reg_path = Path('docs/atlas/registry.json')
          reg = json.loads(reg_path.read_text(encoding='utf-8'))
          target = next(e for e in reg['entries'] if e['id'] == 'ADR-0007')
          target['status'] = 'proposed'
          reg_path.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          atlas_path = Path('docs/atlas/index.html')
          text = atlas_path.read_text(encoding='utf-8')
          text = text.replace('<span class="label">Entries</span>\n          <strong>43</strong>', '<span class="label">Entries</span>\n          <strong>44</strong>', 1)

          row = '''            <tr>
  <td><a class="id-link" href="../decisions/0007-bootstrap-stewardship-constitutional-authority.md">ADR-0007</a></td>
  <td><strong>Bootstrap Stewardship and Constitutional Authority</strong></td>
  <td><span class="chip">decision</span></td>
  <td><span class="status status-proposed">proposed</span></td>
  <td><code>docs/decisions/0007-bootstrap-stewardship-constitutional-authority.md</code></td>
  <td>Defines founder custody as a transparent bootstrap state, bounds stewardship under the invariant core, introduces a suspensive protective brake, and sets a guarded path toward plural constitutional authority.</td>
</tr>
'''

          if 'ADR-0007</a>' not in text:
              marker = '''  <td>Establishes the Behavior Atlas as an evidence-first, human-reviewed pilot that maps claims and patterns without person scoring or autonomous publication.</td>
</tr>
'''
              if marker not in text:
                  raise SystemExit('ADR-0006 Atlas row marker not found')
              text = text.replace(marker, marker + row, 1)

          atlas_path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit helper output
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- docs/atlas/registry.json docs/atlas/index.html; then
            echo "Nothing to patch"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/atlas/registry.json docs/atlas/index.html
          git commit -m "docs(atlas): mark stewardship ADR proposed"
          git push origin HEAD:docs/constitutional-stewardship-v0-1
