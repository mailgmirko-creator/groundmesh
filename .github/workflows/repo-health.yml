name: repo-health

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JSON
        run: |
          python - << 'PY'
          import sys, json, pathlib
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          for p in pathlib.Path('.').rglob('*.webmanifest'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          for p in pathlib.Path('.').rglob('*.schema.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          if bad:
              print("JSON validation errors:")
              for f, err in bad:
                  print(f"- {f}: {err}")
              sys.exit(1)
          print("JSON OK")
          PY

      - name: Validate Behavior Atlas case bundles against Draft 2020-12 schema
        run: |
          python -m pip install --disable-pip-version-check --quiet 'jsonschema[format]>=4.23,<5'
          python - << 'PY'
          import json
          import pathlib
          import sys
          from jsonschema import Draft202012Validator, FormatChecker

          schema_path = pathlib.Path('docs/behavior-atlas/schema/v0.1.schema.json')
          case_paths = [pathlib.Path('docs/behavior-atlas/examples/synthetic-case.json')]
          case_paths.extend(sorted(pathlib.Path('internal/behavior-atlas/cases').glob('*.json')))

          if len(case_paths) < 2:
              print('No real Behavior Atlas case bundles found.')
              sys.exit(1)

          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          failed = False
          for case_path in case_paths:
              instance = json.loads(case_path.read_text(encoding='utf-8'))
              errors = sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path))
              if errors:
                  failed = True
                  print(f'Schema errors in {case_path}:')
                  for error in errors:
                      where = '.'.join(str(part) for part in error.absolute_path) or '$'
                      print(f'- {where}: {error.message}')
              else:
                  print(f'Schema OK: {case_path}')

          if failed:
              sys.exit(1)
          PY

      - name: Validate Human Mesh foundation contracts
        run: |
          python scripts/human-mesh-validate.py

      - name: Validate Human Mesh H1 synthetic lifecycle
        run: |
          python scripts/human-mesh-pilot-cycle.py dry-run

      - name: Validate Human Mesh H2 invite-gated intake
        run: |
          python tools/registration_pilot_server.py --self-test

      - name: Validate tracked git hooks
        shell: pwsh
        run: |
          ./scripts/install-git-hooks.ps1 -CheckOnly

      - name: Validate GroundMesh steward loop
        shell: pwsh
        run: |
          ./scripts/groundmesh-steward.ps1 -CheckOnly

      - name: Validate needs/offers readiness gate
        shell: pwsh
        run: |
          ./scripts/needs-offers-readiness-guard.ps1

      - name: Validate money/value readiness gate
        shell: pwsh
        run: |
          ./scripts/money-value-readiness-guard.ps1

      - name: Validate Behavior Atlas schema sandbox
        shell: pwsh
        run: |
          ./scripts/behavior-atlas-validate.ps1 -RequireSynthetic

      - name: Validate Behavior Atlas negative fixtures
        shell: pwsh
        run: |
          ./scripts/behavior-atlas-negative-fixtures.ps1

      - name: Validate all real Behavior Atlas cases
        shell: pwsh
        run: |
          $cases = @(Get-ChildItem 'internal/behavior-atlas/cases/*.json' | Sort-Object Name)
          if ($cases.Count -lt 1) { throw 'No real Behavior Atlas case bundles found.' }
          foreach ($case in $cases) {
            Write-Host "Validating real case: $($case.Name)"
            ./scripts/behavior-atlas-validate.ps1 -DataPath $case.FullName
          }

      - name: Guard Behavior Atlas unlisted previews
        run: |
          python - << 'PY'
          import pathlib
          import sys

          preview_dir = pathlib.Path('docs/behavior-atlas/preview')
          previews = sorted(preview_dir.glob('*.html'))
          if not previews:
              print('No Behavior Atlas preview pages found.')
              sys.exit(1)

          required = [
              'noindex,nofollow,noarchive',
              'Single-reviewer warning',
              'Submit a correction',
              'not a public-alpha finding',
              'footprint, not the soul',
          ]
          searchable_suffixes = {'.html', '.md', '.json', '.js', '.webmanifest', '.txt'}
          failed = False

          for preview in previews:
              html = preview.read_text(encoding='utf-8')
              missing = [marker for marker in required if marker not in html]
              if missing:
                  failed = True
                  print(f'{preview} is missing required guardrail copy:')
                  for marker in missing:
                      print(f'- {marker}')

              public_path = preview.relative_to('docs').as_posix()
              leaks = []
              for path in pathlib.Path('docs').rglob('*'):
                  if not path.is_file() or path == preview:
                      continue
                  if path.suffix.lower() not in searchable_suffixes:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if public_path in text:
                      leaks.append(str(path))

              if leaks:
                  failed = True
                  print(f'{preview} must remain unlisted; direct path was referenced from:')
                  for path in leaks:
                      print(f'- {path}')
              else:
                  print(f'Unlisted preview OK: {preview}')

          if failed:
              sys.exit(1)
          print(f'Behavior Atlas unlisted preview guard OK ({len(previews)} previews)')
          PY

      - name: Guard Behavior Atlas M4 public alpha release
        run: |
          python scripts/behavior-atlas-public-alpha-guard.py

      - name: Run Behavior Atlas restore drill
        shell: pwsh
        run: |
          ./scripts/behavior-atlas-restore-drill.ps1

      - name: Validate Coordination Field synthetic breathing test
        shell: pwsh
        run: |
          ./scripts/coordination-fixture-validate.ps1

      # UNICEF Data serves this valid public page as 403 to GitHub-hosted runners.
      # SIPRI's landing page can time out from hosted runners; the official PDF is verified separately below.
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206 --max-concurrency 8 --timeout 20 --retry-wait-time 2 --exclude 'https://data\.unicef\.org/resources/jmp-report-2025/' --exclude 'https://www\.sipri\.org/publications/2026/sipri-fact-sheets/trends-world-military-expenditure-2025' --verbose README.md docs/**/*.html docs/**/*.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SIPRI official source fallback
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            --output /dev/null \
            https://www.sipri.org/sites/default/files/2026-04/2604_milex_2025.pdf
          echo "SIPRI official PDF source reachable."

      - name: Create lychee negative self-test probe
        run: |
          probe_dir="$RUNNER_TEMP/lychee-negative-self-test"
          mkdir -p "$probe_dir"
          printf '[deliberately broken](./missing-groundmesh-link-health-probe.html)\n' > "$probe_dir/probe.md"

      - name: Run lychee negative self-test
        id: lychee-negative-self-test
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "${{ runner.temp }}/lychee-negative-self-test/probe.md"
          fail: false
          output: "${{ runner.temp }}/lychee-negative-self-test/output.md"

      - name: Verify lychee rejects a broken local link
        run: |
          output_path="$RUNNER_TEMP/lychee-negative-self-test/output.md"
          cat "$output_path"
          if [ "${{ steps.lychee-negative-self-test.outputs.exit_code }}" -eq 0 ]; then
            echo "Lychee negative self-test failed: a deliberately broken local link was accepted."
            exit 1
          fi
          if ! grep -q 'missing-groundmesh-link-health-probe.html' "$output_path"; then
            echo "Lychee negative self-test failed: nonzero exit did not identify the deliberately broken link."
            exit 1
          fi
          echo "Lychee negative self-test OK: deliberately broken local link was rejected."

      - name: Confirm Atlas index exists
        run: |
          test -f docs/atlas/index.html && echo "Atlas present" || (echo "Missing docs/atlas/index.html" && exit 1)
