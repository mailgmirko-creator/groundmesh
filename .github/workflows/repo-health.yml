name: repo-health

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python - << 'PY'
          import sys, json, pathlib
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          for p in pathlib.Path('.').rglob('*.webmanifest'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          for p in pathlib.Path('.').rglob('*.schema.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          if bad:
              print("JSON validation errors:")
              for f, err in bad:
                  print(f"- {f}: {err}")
              sys.exit(1)
          print("JSON OK")
          PY

      - name: Validate Behavior Atlas case bundles against Draft 2020-12 schema
        run: |
          python -m pip install --disable-pip-version-check --quiet 'jsonschema[format]>=4.23,<5'
          python - << 'PY'
          import json
          import pathlib
          import sys
          from jsonschema import Draft202012Validator, FormatChecker

          schema_path = pathlib.Path('docs/behavior-atlas/schema/v0.1.schema.json')
          case_paths = [
              pathlib.Path('docs/behavior-atlas/examples/synthetic-case.json'),
              pathlib.Path('internal/behavior-atlas/cases/smokovac-matesevo.v0.1.json'),
          ]

          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          failed = False
          for case_path in case_paths:
              instance = json.loads(case_path.read_text(encoding='utf-8'))
              errors = sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path))
              if errors:
                  failed = True
                  print(f'Schema errors in {case_path}:')
                  for error in errors:
                      where = '.'.join(str(part) for part in error.absolute_path) or '$'
                      print(f'- {where}: {error.message}')
              else:
                  print(f'Schema OK: {case_path}')

          if failed:
              sys.exit(1)
          PY

      - name: Validate Behavior Atlas schema sandbox
        shell: pwsh
        run: |
          ./scripts/behavior-atlas-validate.ps1 -RequireSynthetic

      - name: Validate Behavior Atlas real M2 case
        shell: pwsh
        run: |
          ./scripts/behavior-atlas-validate.ps1 -DataPath internal/behavior-atlas/cases/smokovac-matesevo.v0.1.json

      - name: Validate Coordination Field synthetic breathing test
        shell: pwsh
        run: |
          ./scripts/coordination-fixture-validate.ps1

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --accept 200,206 --max-concurrency 8 --timeout 20s --retry-wait-time 2 --exclude-mail --verbose README.md docs/**/*.html docs/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm Atlas index exists
        run: |
          test -f docs/atlas/index.html && echo "Atlas present" || (echo "Missing docs/atlas/index.html" && exit 1)
