name: repo-health

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JSON
        run: |
          python - << 'PY'
          import sys, json, pathlib
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          for p in pathlib.Path('.').rglob('*.webmanifest'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          for p in pathlib.Path('.').rglob('*.schema.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          if bad:
              print("JSON validation errors:")
              for f, err in bad:
                  print(f"- {f}: {err}")
              sys.exit(1)
          print("JSON OK")
          PY

      - name: Validate Behavior Atlas case bundles against Draft 2020-12 schema
        run: |
          python -m pip install --disable-pip-version-check --quiet 'jsonschema[format]>=4.23,<5'
          python - << 'PY'
          import json
          import pathlib
          import sys
          from jsonschema import Draft202012Validator, FormatChecker

          schema_path = pathlib.Path('docs/behavior-atlas/schema/v0.1.schema.json')
          case_paths = [pathlib.Path('docs/behavior-atlas/examples/synthetic-case.json')]
          case_paths.extend(sorted(pathlib.Path('internal/behavior-atlas/cases').glob('*.json')))

          if len(case_paths) < 2:
              print('No real Behavior Atlas case bundles found.')
              sys.exit(1)

          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          failed = False
          for case_path in case_paths:
              instance = json.loads(case_path.read_text(encoding='utf-8'))
              errors = sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path))
              if errors:
                  failed = True
                  print(f'Schema errors in {case_path}:')
                  for error in errors:
                      where = '.'.join(str(part) for part in error.absolute_path) or '$'
                      print(f'- {where}: {error.message}')
              else:
                  print(f'Schema OK: {case_path}')

          if failed:
              sys.exit(1)
          PY

      - name: Validate Behavior Atlas schema sandbox
        shell: pwsh
        run: |
          ./scripts/behavior-atlas-validate.ps1 -RequireSynthetic

      - name: Validate all real Behavior Atlas cases
        shell: pwsh
        run: |
          $cases = @(Get-ChildItem 'internal/behavior-atlas/cases/*.json' | Sort-Object Name)
          if ($cases.Count -lt 1) { throw 'No real Behavior Atlas case bundles found.' }
          foreach ($case in $cases) {
            Write-Host "Validating real case: $($case.Name)"
            ./scripts/behavior-atlas-validate.ps1 -DataPath $case.FullName
          }

      - name: Guard Behavior Atlas unlisted previews
        run: |
          python - << 'PY'
          import pathlib
          import sys

          preview_dir = pathlib.Path('docs/behavior-atlas/preview')
          previews = sorted(preview_dir.glob('*.html'))
          if not previews:
              print('No Behavior Atlas preview pages found.')
              sys.exit(1)

          required = [
              'noindex,nofollow,noarchive',
              'Single-reviewer warning',
              'Submit a correction',
              'not a public-alpha finding',
              'footprint, not the soul',
          ]
          searchable_suffixes = {'.html', '.md', '.json', '.js', '.webmanifest', '.txt'}
          failed = False

          for preview in previews:
              html = preview.read_text(encoding='utf-8')
              missing = [marker for marker in required if marker not in html]
              if missing:
                  failed = True
                  print(f'{preview} is missing required guardrail copy:')
                  for marker in missing:
                      print(f'- {marker}')

              public_path = preview.relative_to('docs').as_posix()
              leaks = []
              for path in pathlib.Path('docs').rglob('*'):
                  if not path.is_file() or path == preview:
                      continue
                  if path.suffix.lower() not in searchable_suffixes:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if public_path in text:
                      leaks.append(str(path))

              if leaks:
                  failed = True
                  print(f'{preview} must remain unlisted; direct path was referenced from:')
                  for path in leaks:
                      print(f'- {path}')
              else:
                  print(f'Unlisted preview OK: {preview}')

          if failed:
              sys.exit(1)
          print(f'Behavior Atlas unlisted preview guard OK ({len(previews)} previews)')
          PY

      - name: Guard Behavior Atlas M4 public alpha release
        run: |
          python - << 'PY'
          import datetime as dt
          import json
          import pathlib
          import re
          import sys

          manifest_path = pathlib.Path('docs/behavior-atlas/releases/m4-public-alpha-v0.1.json')
          required_paths = [
              pathlib.Path('docs/behavior-atlas/index.html'),
              pathlib.Path('docs/behavior-atlas/PUBLIC_ALPHA_POLICY.md'),
              pathlib.Path('docs/behavior-atlas/PRIVACY_HARM_REVIEW.md'),
              pathlib.Path('docs/behavior-atlas/CHANGELOG.md'),
              manifest_path,
              pathlib.Path('scripts/behavior-atlas-restore-drill.ps1'),
          ]
          missing_paths = [str(p) for p in required_paths if not p.is_file()]
          if missing_paths:
              print('M4 public-alpha required files are missing:')
              for path in missing_paths:
                  print(f'- {path}')
              sys.exit(1)

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          errors = []
          if manifest.get('stage') != 'public_alpha':
              errors.append('release manifest stage must be public_alpha')
          if manifest.get('evidence_state') != 'sourced_not_independently_adjudicated':
              errors.append('release manifest must preserve sourced/not-independently-adjudicated evidence state')
          rollback_ref = str(manifest.get('rollback_ref', ''))
          if not re.fullmatch(r'[a-f0-9]{40}', rollback_ref):
              errors.append('rollback_ref must be a full 40-character Git SHA')

          cases = manifest.get('cases', [])
          if len(cases) < 3:
              errors.append('M4 public alpha requires at least three cases')

          today = dt.date.today()
          index_html = pathlib.Path('docs/behavior-atlas/index.html').read_text(encoding='utf-8')
          for marker in ['M4 Public Alpha', 'single-reviewer warning', 'Corrections are part of the system', 'no person scoring']:
              if marker.lower() not in index_html.lower():
                  errors.append(f'public front door missing marker: {marker}')

          for case in cases:
              public_path = pathlib.Path(case.get('public_path', ''))
              source_bundle = pathlib.Path(case.get('source_bundle', ''))
              prior_preview = pathlib.Path(case.get('prior_preview', ''))
              if not public_path.is_file():
                  errors.append(f'missing public case page: {public_path}')
                  continue
              if not source_bundle.is_file():
                  errors.append(f'missing source bundle: {source_bundle}')
              if not prior_preview.is_file():
                  errors.append(f'missing prior guarded preview: {prior_preview}')

              try:
                  review_due = dt.date.fromisoformat(case['review_due'])
              except Exception:
                  errors.append(f"invalid review_due for {case.get('case_id')}")
                  continue
              if review_due < today:
                  errors.append(f"already-expired review_due for {case.get('case_id')}: {review_due}")

              html = public_path.read_text(encoding='utf-8')
              if 'noindex' in html.lower():
                  errors.append(f'public-alpha page still carries noindex: {public_path}')
              for marker in ['Public Alpha', 'Single-reviewer warning', 'Submit a correction', 'footprint, not the soul', 'Assessment review due']:
                  if marker.lower() not in html.lower():
                      errors.append(f'{public_path} missing marker: {marker}')
              if case['review_due'] not in html:
                  errors.append(f'{public_path} does not embed review_due {case["review_due"]}')

              relative_public = public_path.relative_to('docs/behavior-atlas').as_posix()
              if relative_public not in index_html:
                  errors.append(f'public front door does not link case: {relative_public}')

          policy = pathlib.Path('docs/behavior-atlas/PUBLIC_ALPHA_POLICY.md').read_text(encoding='utf-8')
          for marker in ['Review-due and expiry rule', 'Withdrawal and rollback', 'Human responsibility']:
              if marker not in policy:
                  errors.append(f'public-alpha policy missing section: {marker}')

          harm = pathlib.Path('docs/behavior-atlas/PRIVACY_HARM_REVIEW.md').read_text(encoding='utf-8')
          for marker in ['Privacy and Harm Review', 'Residual risk', 'Release decision']:
              if marker.lower() not in harm.lower():
                  errors.append(f'privacy/harm review missing marker: {marker}')

          changelog = pathlib.Path('docs/behavior-atlas/CHANGELOG.md').read_text(encoding='utf-8')
          if 'M4 public alpha v0.1' not in changelog:
              errors.append('Behavior Atlas changelog missing M4 public alpha v0.1 entry')

          registry = json.loads(pathlib.Path('docs/atlas/registry.json').read_text(encoding='utf-8'))
          atlas_entry = next((e for e in registry.get('entries', []) if e.get('id') == 'PAGE-BEHAVIOR-ATLAS'), None)
          if not atlas_entry:
              errors.append('Project Atlas registry missing PAGE-BEHAVIOR-ATLAS')
          elif atlas_entry.get('path') != 'docs/behavior-atlas/index.html' or atlas_entry.get('status') != 'active':
              errors.append('PAGE-BEHAVIOR-ATLAS registry entry must be active and point to docs/behavior-atlas/index.html')

          atlas_html = pathlib.Path('docs/atlas/index.html').read_text(encoding='utf-8')
          if 'PAGE-BEHAVIOR-ATLAS' not in atlas_html or '../behavior-atlas/index.html' not in atlas_html:
              errors.append('generated Project Atlas index does not expose PAGE-BEHAVIOR-ATLAS')

          if errors:
              print('M4 public-alpha guard failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)
          print(f'M4 public-alpha guard OK ({len(cases)} cases; review dates current)')
          PY

      - name: Run Behavior Atlas restore drill
        shell: pwsh
        run: |
          ./scripts/behavior-atlas-restore-drill.ps1

      - name: Validate Coordination Field synthetic breathing test
        shell: pwsh
        run: |
          ./scripts/coordination-fixture-validate.ps1

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --accept 200,206 --max-concurrency 8 --timeout 20s --retry-wait-time 2 --exclude-mail --verbose README.md docs/**/*.html docs/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm Atlas index exists
        run: |
          test -f docs/atlas/index.html && echo "Atlas present" || (echo "Missing docs/atlas/index.html" && exit 1)
