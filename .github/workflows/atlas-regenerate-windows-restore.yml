name: atlas-link-repair-restore

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'docs/restore-invariants-i-vii' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/restore-invariants-i-vii

      - name: Repair Atlas entry links from registry paths
        shell: python
        run: |
          import json, posixpath, re
          from pathlib import Path

          registry = json.loads(Path('docs/atlas/registry.json').read_text(encoding='utf-8'))
          path = Path('docs/atlas/index.html')
          text = path.read_text(encoding='utf-8')

          for entry in registry['entries']:
              entry_id = entry['id']
              href = posixpath.relpath(entry['path'], 'docs/atlas')
              pattern = re.compile(r'(<a class="id-link" href=")[^"]+(">' + re.escape(entry_id) + r'</a>)')
              text, count = pattern.subn(r'\1' + href + r'\2', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not repair Atlas link for {entry_id}')

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit repaired Atlas
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- docs/atlas/index.html; then
            echo "Atlas links already correct"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/atlas/index.html
          git commit -m "docs(atlas): restore correct relative links"
          git push origin HEAD:docs/restore-invariants-i-vii
