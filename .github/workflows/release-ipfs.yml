name: Release Artifact

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - "apps/local-cli/**"
      - "scripts/**"
      - ".github/workflows/release-ipfs.yml"

jobs:
  build-publish:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local-cli deps
        run: |
          cd apps\local-cli
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -r requirements.txt

      - name: Build release zip
        run: |
          cd apps\local-cli
          .\.venv\Scripts\python .\main.py --task release

      - name: Preserve release artifact
        uses: actions/upload-artifact@v4
        with:
          name: groundmesh-release-${{ github.sha }}
          path: releases/*
          if-no-files-found: error
          retention-days: 30

      - name: Report release artifact and mirror status
        shell: pwsh
        run: |
          "### GroundMesh release" >> $env:GITHUB_STEP_SUMMARY
          "- Artifact: groundmesh-release-${{ github.sha }} (ZIP and SHA-256 manifest, retained for 30 days)" >> $env:GITHUB_STEP_SUMMARY
          "- IPFS mirror: unavailable because Storacha retired its developer upload service." >> $env:GITHUB_STEP_SUMMARY
